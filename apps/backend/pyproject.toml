[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vendors-market-backend"
version = "0.1.0"
description = "FastAPI backend for Vendor's Market"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.15,<2",
    "asyncpg>=0.30,<1",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "minio>=7.2,<8",
    "pydantic-settings>=2.8,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
vmarket-grant-admin = "app.identity.bootstrap_admin:main"
vmarket-seed-demo = "app.catalog.seed_demo:main"
vmarket-seed-trade-demo = "app.trading.seed_demo:main"

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21,<1",
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
mypy_path = "apps/backend"
files = ["apps/backend/app"]
strict = true
plugins = ["pydantic.mypy"]
