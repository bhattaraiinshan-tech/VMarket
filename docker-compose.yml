services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${VMARKET_POSTGRES_DB:-vmarket}
      POSTGRES_USER: ${VMARKET_POSTGRES_USER:-vmarket}
      POSTGRES_PASSWORD: ${VMARKET_POSTGRES_PASSWORD:-vmarket-local}
    ports:
      - "${VMARKET_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    build:
      context: ./infra/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${VMARKET_MINIO_ACCESS_KEY:-vmarket-local}
      MINIO_ROOT_PASSWORD: ${VMARKET_MINIO_SECRET_KEY:-vmarket-local-secret}
    ports:
      - "${VMARKET_MINIO_PORT:-9000}:9000"
      - "${VMARKET_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  minio-data:
